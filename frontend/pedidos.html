<!DOCTYPE html>

  <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">

  <link rel="stylesheet" href="colecoes.css" />

  <script src="./progAdd.js" defer></script>
</head>
<body>

  <!-- Faixa inicial -->
  <section class="hero-banner">
    <img src="../img/new_colection.png" alt="MG Beauty Wear - Nova Coleção">

  <!-- Navegação -->
  <nav class="top-nav">
    <ul>
      <li><a href="./index.html">Início</a></li>

  <!-- Seção Coleções -->
  <section class="colecoes">

    <h1>Nossas Opções</h1>
    <p class="descricao">Escolha suas peças favoritas e adicione ao carrinho!</p>

    <div class="grid-colecoes">

      <!-- PRODUTO 01 -->
      <div class="item">
        <img src="../img/vestido1.png" alt="Vestido Elegance 01">
        <h3>Vestido Elegance 01</h3>
        <div class="controle-produto">
          <input type="number" value="1" min="1" class="input-qtde">
          <button class="btn-add"
            data-nome="Vestido Elegance 01"
            data-preco="199.90"
            data-codprod="1">
            Adicionar
          </button>
        </div>
      </div>

      <!-- PRODUTO 02 -->
      <div class="item">
        <img src="../img/vestido2.png" alt="Vestido Clássico 02">
        <h3>Vestido Clássico 02</h3>
        <div class="controle-produto">
          <input type="number" value="1" min="1" class="input-qtde">
          <button class="btn-add"
            data-nome="Vestido Clássico 02"
            data-preco="189.90"
            data-codprod="2">
            Adicionar
          </button>
        </div>
      </div>

      <!-- PRODUTO 03 -->
      <div class="item">
        <img src="../img/vestido3.png" alt="Vestido Fashion 03">
        <h3>Vestido Fashion 03</h3>
        <div class="controle-produto">
          <input type="number" value="1" min="1" class="input-qtde">
          <button class="btn-add"
            data-nome="Vestido Fashion 03"
            data-preco="179.90"
            data-codprod="3">
            Adicionar
          </button>
        </div>
      </div>

      <!-- PRODUTO 04 -->
      <div class="item">
        <img src="../img/vestido4.png" alt="Vestido Premium 04">
        <h3>Vestido Premium 04</h3>
        <div class="controle-produto">
          <input type="number" value="1" min="1" class="input-qtde">
          <button class="btn-add"
            data-nome="Vestido Premium 04"
            data-preco="219.90"
            data-codprod="4">
            Adicionar
          </button>
        </div>
      </div>

    </div>
  </section>

  <footer class="rodape">
    <p>&copy; 2025 MG Beauty Wear.</p>
  </footer>
